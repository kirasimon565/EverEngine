name: everengine
description: "Interactive Story Game Engine for Android (Flutter-Native)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  uuid: ^4.4.0
  archive: ^3.6.0
  path_provider: ^2.1.3
  path: ^1.9.0
  collection: ^1.18.0
  equatable: ^2.0.5
